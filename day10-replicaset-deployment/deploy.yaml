apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: shop
  name: shop-deploy
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - image: nginx:1.25
          name: shop
