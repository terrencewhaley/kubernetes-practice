apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: nginx:1.25
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: backend-svc
  name: backend-svc
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: backend
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend-np
  name: frontend-np
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - nodePort: 30080
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend-lb
  name: frontend-lb
spec:
  ports:
    - port: 80
      protocol: TCP
  selector:
    app: frontend
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: ext-svc
spec:
  type: ExternalName
  externalName: example.com
